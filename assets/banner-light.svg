<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Saif Qureshi — AI Systems Engineer, Berlin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="0.55" stop-color="#f5f5f4"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdc700" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fdc700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1e293b" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="rounded"><rect width="1600" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="420" fill="url(#bg)"/>
    <rect width="1600" height="420" fill="url(#dots)"/>
    <circle cx="1318" cy="210" r="270" fill="url(#glow)"/>

    <!-- agent / retrieval node motif -->
    <g transform="translate(1318,210)">
      <circle r="182" fill="none" stroke="#1e293b" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="4 9"/>
      <circle r="130" fill="none" stroke="#1e293b" stroke-opacity="0.10" stroke-width="1.5"/>
      <g stroke="#1e293b" stroke-opacity="0.26" stroke-width="2">
        <line x1="0" y1="0" x2="0" y2="-130"/>
        <line x1="0" y1="0" x2="112.6" y2="-65"/>
        <line x1="0" y1="0" x2="112.6" y2="65"/>
        <line x1="0" y1="0" x2="0" y2="130"/>
        <line x1="0" y1="0" x2="-112.6" y2="65"/>
        <line x1="0" y1="0" x2="-112.6" y2="-65"/>
      </g>
      <g stroke="#1e293b" stroke-opacity="0.34" stroke-width="2.5">
        <circle cx="0" cy="-130" r="15" fill="#ffffff"/>
        <circle cx="112.6" cy="-65" r="15" fill="#fdc700"/>
        <circle cx="112.6" cy="65" r="15" fill="#ffffff"/>
        <circle cx="0" cy="130" r="15" fill="#ffffff"/>
        <circle cx="-112.6" cy="65" r="15" fill="#fdc700"/>
        <circle cx="-112.6" cy="-65" r="15" fill="#ffffff"/>
      </g>
      <circle r="44" fill="none" stroke="#fdc700" stroke-width="3"/>
      <circle r="32" fill="#1e293b"/>
      <circle r="9" fill="#fdc700"/>
    </g>

    <!-- monogram -->
    <rect x="96" y="70" width="60" height="60" rx="18" fill="#1e293b"/>
    <text x="126" y="110" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="0.5" fill="#fafaf9" text-anchor="middle">SQ</text>
    <circle cx="158" cy="72" r="6" fill="#fdc700"/>

    <!-- availability pill -->
    <rect x="180" y="82" width="300" height="36" rx="18" fill="#fdc700" fill-opacity="0.20" stroke="#fdc700" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="203" cy="100" r="5" fill="#a16207"/>
    <text x="218" y="106" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.9" fill="#713f12">AVAILABLE FOR CONSULTING</text>

    <!-- name -->
    <text x="96" y="248" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-3" fill="#1c1917">Saif Qureshi</text>

    <!-- subtitle -->
    <text x="96" y="302" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="500" letter-spacing="-0.3" fill="#475569">AI Systems Engineer — agents, retrieval, production AI</text>

    <rect x="96" y="330" width="118" height="4" rx="2" fill="#fdc700"/>

    <!-- meta -->
    <text x="96" y="378" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="500" letter-spacing="0.2" fill="#64748b">Berlin, Germany  ·  Founder of SolutionPlus.io  ·  heyitsaif.com</text>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="418.5" rx="28" fill="none" stroke="#1e293b" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>
