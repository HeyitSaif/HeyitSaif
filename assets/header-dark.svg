<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Saif Qureshi, AI product engineer</title>
  <desc id="d">Technical partner for founders. Production AI agents, from idea to production. Berlin.</desc>
  <defs>
    <filter id="bleed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fafaf9" fill-opacity="0.06"/></pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="0.62" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#fdc700"/>
    </linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#fdc700"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#0c0a09"/>
    <g filter="url(#bleed)">
      <circle cx="120" cy="40" r="260" fill="#fdc700" fill-opacity="0.34"/>
      <circle cx="430" cy="-40" r="200" fill="#f59e0b" fill-opacity="0.2"/>
      <circle cx="1180" cy="440" r="300" fill="#94a3b8" fill-opacity="0.2"/>
      <circle cx="1060" cy="200" r="150" fill="#fdc700" fill-opacity="0.15300000000000002"/>
    </g>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <!-- frosted glass card -->
    <rect x="48" y="44" width="1184" height="352" rx="22" fill="#000" fill-opacity="0.55" filter="url(#soft)" transform="translate(0 14)"/>
    <rect x="48" y="44" width="1184" height="352" rx="22" fill="url(#glass)"/>
    <rect x="48" y="44" width="1184" height="352" rx="22" fill="url(#sheen)"/>
    <rect x="48.75" y="44.75" width="1182.5" height="350.5" rx="21.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="47.5" y="43.5" width="1185" height="353" rx="22.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <!-- eyebrow chip -->
    <g transform="translate(96,92)">
      <rect width="356" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="17" r="5" fill="#fdc700"/>
      <circle cx="20" cy="17" r="9" fill="none" stroke="#fdc700" stroke-opacity="0.45"/>
      <text x="38" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2" fill="#a8a29e">AI PRODUCT ENGINEER · BERLIN</text>
    </g>
    <text x="92" y="206" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="url(#name)">Saif Qureshi</text>
    <text x="96" y="252" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#fafaf9">Technical partner for founders. <tspan fill="#fdc700">Production AI agents,</tspan></text>
    <text x="96" y="286" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#fafaf9">from idea to production.</text>
    <text x="96" y="356" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#fafaf9">$2M/mo</text><text x="96" y="382" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a8a29e">Meta ad spend on Parker AI</text><text x="346" y="356" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#fafaf9">30+</text><text x="346" y="382" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a8a29e">agent tools and workflows shipped</text><line x1="318" y1="330" x2="318" y2="386" stroke="#ffffff" stroke-opacity="0.096"/><text x="596" y="356" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#fafaf9">Since 2017</text><text x="596" y="382" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a8a29e">shipping production software</text><line x1="568" y1="330" x2="568" y2="386" stroke="#ffffff" stroke-opacity="0.096"/>
    <!-- agent graph -->
    <polygon points="944,138 1032,110 1124,146 1136,242 1048,306 948,276" fill="none" stroke="#fafaf9" stroke-opacity="0.15" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g stroke="#fafaf9" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round"><line x1="1036" y1="214" x2="944" y2="138"/><line x1="1036" y1="214" x2="1032" y2="110"/><line x1="1036" y1="214" x2="1124" y2="146"/><line x1="1036" y1="214" x2="1136" y2="242"/><line x1="1036" y1="214" x2="1048" y2="306"/><line x1="1036" y1="214" x2="948" y2="276"/></g>
    <g transform="translate(944,138)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="-22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">PLAN</text></g><g transform="translate(1032,110)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="-22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">RETRIEVE</text></g><g transform="translate(1124,146)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="-22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">TOOLS</text></g><g transform="translate(1136,242)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">ACT</text></g><g transform="translate(1048,306)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">EVAL</text></g><g transform="translate(948,276)"><circle r="7" fill="#fafaf9" fill-opacity="0.85"/><circle r="13" fill="none" stroke="#fafaf9" stroke-opacity="0.18"/><text x="0" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#a8a29e">MEMORY</text></g>
    <circle cx="1036" cy="214" r="44" fill="#fdc700" fill-opacity="0.18"/>
    <circle cx="1036" cy="214" r="26" fill="url(#core)"/>
    <text x="1036" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1c1917">SQ</text>
    <text x="1184" y="374" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1" fill="#a8a29e">heyitsaif.com</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
